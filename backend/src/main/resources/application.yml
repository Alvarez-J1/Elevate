spring:
  application:
    name: elevate-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/elevate}
    username: ${DATABASE_USERNAME:elevate}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates that entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never

elevate:
  security:
    jwt:
      secret: ${ELEVATE_JWT_SECRET}
      expiration-ms: ${ELEVATE_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${ELEVATE_FRONTEND_ORIGIN:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.elevate.backend: ${ELEVATE_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${ELEVATE_SQL_LOG_LEVEL:WARN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
