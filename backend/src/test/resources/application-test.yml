spring:
  datasource:
    url: jdbc:h2:mem:elevate-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

elevate:
  security:
    jwt:
      secret: test-only-secret-key-that-is-long-enough-for-hmac-256-signing
      expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000
